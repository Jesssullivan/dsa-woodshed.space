name: Deploy to GitHub Pages

# Live push-to-main deploy for https://dsa-woodshed.space (custom domain via
# static/CNAME, so the build uses base="" / no BASE_PATH). Plain pnpm +
# adapter-static build published to GitHub Pages.
#
# RUNNERS: jobs run on the self-hosted ARC pool for this repo (shared
# capability label `tinyland-docker`; scale set jesssullivan-dsa-woodshed-
# browser, image ghcr.io/tinyland-inc/actions-runner-browser — Playwright
# system libs pre-baked). Keeps this private repo entirely off GitHub-hosted
# minutes.
#
# CONTENT SYNC: src/content is generated — a fresh checkout carries only the
# committed .manifest.json, and `pnpm run build` does NOT sync, so the build
# job below checks out the packet repo and runs `pnpm run sync-content`
# (the WOODSHED_PACKET_PATH contract in scripts/sync-content.mjs) before
# building. The packet is PUBLIC (launched 2026-07-09), so the checkout
# needs no credential — the default GITHUB_TOKEN suffices.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: tinyland-docker
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Content source: the public study packet. The site renders content
      # synced from it; without this checkout + the sync step below, the
      # $content imports cannot resolve and the build is guaranteed red.
      - name: Check out the study packet
        uses: actions/checkout@v7
        with:
          repository: Jesssullivan/dsa-study-packet
          path: dsa-study-packet

      # Self-hosted runner image ships no system node: setup-node must run
      # BEFORE pnpm/action-setup (whose self-installer needs node), and
      # `cache: pnpm` can't be used (it needs pnpm before pnpm exists).
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync content from the study packet
        run: pnpm run sync-content
        env:
          WOODSHED_PACKET_PATH: ${{ github.workspace }}/dsa-study-packet

      - name: Build static site (custom domain, base="")
        run: pnpm run build
        env:
          NODE_ENV: production

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build
          # v4 started excluding dotfiles from the artifact by default; the
          # build ships static/.nojekyll (copied verbatim by adapter-static)
          # so GitHub Pages skips Jekyll processing, which otherwise ignores
          # the underscore-prefixed _app/ directory SvelteKit ships assets
          # under. Without this the deployed site 404s on every asset.
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: tinyland-docker
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
