name: Deploy to GitHub Pages (DRAFT)

# DRAFT / DISABLED-BY-DEFAULT.
#
# No GitHub repository exists for The DSA Woodshed yet, so this workflow is
# manual-dispatch only (no push/pull_request triggers) and will not run on its
# own. It is a plain pnpm + adapter-static build that publishes to GitHub Pages;
# it deliberately carries NO Nix, Bazel, or estate ci-templates coupling (the
# scaffold's original workflows referenced tinyland-inc/* reusable workflows and
# `nix develop --command just ...` and were removed on fork).
#
# The site targets the custom domain dsa-woodshed.space via static/CNAME, so the
# build uses base="" (no BASE_PATH). To enable once a repo + Pages exist:
#   1. Add `push: { branches: [main] }` to the `on:` block below.
#   2. Enable Pages (Settings -> Pages -> Source: GitHub Actions).
#   3. Confirm the CNAME (dsa-woodshed.space) matches the DNS target.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site (custom domain, base="")
        run: pnpm run build
        env:
          NODE_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
